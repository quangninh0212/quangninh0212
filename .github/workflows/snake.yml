name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "19 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: quangninh0212
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF83CC&color_dots=%23EBEDF0,%23FCE0F4,%23D8B3FF,%23AA8CFF,%236E56B7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%237DEDE3&color_dots=%23161B22,%233B2E5F,%236956A0,%23AE7CCF,%23F584C5

      - name: Publish result to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
